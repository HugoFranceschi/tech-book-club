<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<div class="p1">
				<img src="Icon.svg" alt="logo" />
				<h3>Tech book club</h3>
			</div>
			<div class="p2">
				<div class="p2-1">
					<h1 class="polise-n1">Join the ultimate tech book club</h1>
					<p class="polise-n2">
						Turn your reading time into learning time with fellow tech
						enthusiasts. Get curated recommendations, join vibrant discussions,
						and level up your skills one chapter at a time.
					</p>
					<div class="p2-2">
						<button>
							<h6 class="polise-n1">REVIEW MEMBERSHIP OPTIONS</h6>
							<img src="flèche-vaire-le-bas.svg" alt="flèche" />
						</button>
						<div class="p2-2-1">
							<img src="3-pp-en-ligne.svg" alt="pp" />
							<div>
								<img src="Star.svg" alt="étoile" />
								<img src="Star.svg" alt="étoile" />
								<img src="Star.svg" alt="étoile" />
								<img src="Star.svg" alt="étoile" />
								<img src="Star.svg" alt="étoile" />
								<div>
									<p class="polise-n1">200+ developers joined already</p>
								</div>
							</div>
						</div>
					</div>
				</div>
				<img
					class="grand-image"
					src="people-library-reading-club-learning-from-books 1.jpg"
					alt="photo"
				/>
			</div>
		</main>
		<footer>
			<hr />
			<div class="p3">
				<p class="polise-n1">© 2024 – Tech Book Club</p>
				<div>
					<img src="papillon.svg" alt="icon" />
					<img src="in-icon.svg" alt="icon" />
				</div>
			</div>
		</footer>
	</body>
</html>
